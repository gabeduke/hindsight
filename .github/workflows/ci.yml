name: CI

on:
  # A pull request, on each push to it. A push to its branch used to start
  # a second, identical run: 33 of 72 runs in the week to 2026-10-22 were
  # repeats of another.
  pull_request:
  # main is covered by release.yml, which calls this workflow.
  workflow_call:
  # Any other branch, by hand.
  workflow_dispatch:

# A new push to a pull request cancels the run still going for it: only the
# newest commit's result is read. A run for main (release.yml calls this) or
# by hand has a group of its own, so it is never cancelled, and never shares
# release.yml's group, which would deadlock.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

# Called from release.yml, this job would otherwise inherit that workflow's
# contents: write just to run tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # About 5 minutes (median and p90, October 2026), but on 2026-10-22 the
    # runners' apt mirrors took 18 to 36 minutes to install ffmpeg for over
    # two hours, and a run took 41. An hour lets a day like that finish
    # green; a stuck runner still fails here, not at GitHub's six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # internal/audio/source_portaudio.go and sink_portaudio.go are cgo
      # against PortAudio, so the headers are needed
      # to compile the tests -- not to run them. No audio hardware is touched.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y portaudio19-dev ffmpeg

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee go-test.log

      # The job's log isn't always at hand where a PR is read; a failing
      # test's name and message are, as one annotation on the run -- with
      # what the testing package itself says (a TempDir that couldn't be
      # removed) and the race detector's reports, which name no _test.go.
      - name: Name the failing tests
        if: failure()
        run: |
          [ -f go-test.log ] || exit 0
          grep -E -B2 -A30 '^(--- FAIL|WARNING: DATA RACE|panic:)|_test\.go:[0-9]+:|testing\.go:[0-9]+:' go-test.log \
            | head -200 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}' > failures.txt || true
          echo "::error title=go test::$(cat failures.txt)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The waveform page's geometry is pure JS with node's built-in runner;
      # no package.json, no dependencies.
      - name: JS unit tests
        # Each directory is named, so a new one under lib/ is invisible here
        # until it is added. lib/objects/ is the object library.
        run: node --test 'web/static/lib/*.test.js' 'web/static/lib/wave/*.test.js' 'web/static/lib/phone/*.test.js' 'web/static/lib/help/*.test.js' 'web/static/lib/tape/*.test.js' 'web/static/lib/edit/*.test.js' 'web/static/lib/bar/*.test.js' 'web/static/lib/objects/*.test.js' 'web/static/lib/play/*.test.js' 'web/static/lib/scene/*.test.js' 'web/static/lib/rooms/*.test.js' 'web/static/lib/buffer/*.test.js' 'web/static/lib/room/*.test.js' 'web/static/lib/rig/*.test.js' 'web/static/lib/shell/*.test.js' 'web/static/lib/ui/*.test.js'

      - name: Release script tests
        run: ./scripts/test-release-scripts.sh

      # The demo path is what lets anyone run this without hardware. If it
      # breaks, nothing else in this workflow would notice.
      - name: Demo boots without cgo
        run: |
          CGO_ENABLED=0 go build -o /tmp/hindsight ./cmd/hindsight
          RING_SECONDS=30 OUTPUT_DIR=/tmp/takes /tmp/hindsight --demo &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/api/status >/tmp/status.json; then break; fi
            sleep 1
          done
          cat /tmp/status.json
          test -s /tmp/status.json
          # /api/status answers 200 even when the source failed to open, so a
          # non-empty body proves only that the HTTP server is up. capture_healthy
          # flips true as soon as demoSource.Open returns, well inside the poll
          # above, so this is what actually asserts the demo path works.
          grep -q '"capture_healthy":true' /tmp/status.json

  # The user flows (docs/flows.md): Gabe's stories, driven in a real browser
  # against the demo on a tablet and a desktop profile. The unit tests stayed
  # green through a Studio that threw on every load; this is what notices.
  # A todo flow (a story not built yet) reports and never fails the job.
  flows:
    runs-on: ubuntu-latest
    # About 9 minutes, 10 at p90; 47 on the slow-mirror day above.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ffmpeg writes a take's preview; a take without one can't be played.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      # Pinned to the version docs/flows.md installs.
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.0 axe-core@4.11.4
          npx playwright install --with-deps chromium

      # Each scenario prints as Given/When/Then; the layout checks run on
      # every screen. No LLM: the review is its own opt-in workflow
      # (ux-review.yml).
      - name: User flows
        run: |
          CGO_ENABLED=0 go build -o /tmp/hindsight ./cmd/hindsight
          HINDSIGHT_BIN=/tmp/hindsight node scripts/flows.mjs --shots=flow-shots --json=flows.json --storyboard=storyboard

      # The storyboard (storyboard/index.html: every screen, pass or fail),
      # and the failures' screenshots.
      - name: Keep the storyboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-storyboard
          path: |
            storyboard/
            flow-shots/
            flows.json
          if-no-files-found: ignore
