name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Two close merges each build a full arm64 cgo binary, and both deserve a
# release, so queue them rather than cancelling either.
#
# Queueing only orders the runs. It does not make the changelog push safe:
# actions/checkout checks out github.sha, not main's tip, so a run whose
# main has moved on cannot fast-forward main from where it is standing.
# That is handled in "Update the changelog", which re-applies the entry to the
# real tip and warns rather than fails if the push still loses -- the tag and
# the GitHub release are pushed before it runs, and cannot be lost by it.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    # Reused rather than duplicated, so a red main cannot publish.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-24.04-arm
    # Raspberry Pi OS Bookworm ships glibc 2.36; Ubuntu 24.04 links 2.39. A
    # binary built on the bare runner will not start on the Pi, so build
    # against the target distribution instead.
    container: debian:bookworm
    # The hub image is tagged with the release.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y build-essential pkg-config portaudio19-dev git curl ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The checkout is owned by a different uid inside the container, which
      # makes git refuse to read it.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Choose the version
        id: version
        run: |
          date="$(date -u +%Y.%m.%d)"
          tag="$(git tag -l | ./scripts/next-tag.sh "$date")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "building $tag"

      - name: Build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist/bin
          go build -trimpath -ldflags "-s -w -X main.version=$TAG" \
            -o dist/bin/hindsight ./cmd/hindsight
          ls -lh dist/bin/hindsight
          ./dist/bin/hindsight --version

      - name: Assemble the archive
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          name="hindsight_${TAG}_linux_arm64"
          mkdir -p "dist/$name/bin" "dist/$name/web" "dist/$name/deploy"
          cp dist/bin/hindsight              "dist/$name/bin/"
          cp -R web/static                   "dist/$name/web/static"
          cp deploy/hindsight.service        "dist/$name/deploy/"
          cp deploy/hindsight.env.example    "dist/$name/deploy/"
          cp deploy/hindsight-update         "dist/$name/deploy/"
          cp deploy/hindsight-update@.service "dist/$name/deploy/"
          cp deploy/Caddyfile                "dist/$name/deploy/"
          chmod 755 "dist/$name/deploy/hindsight-update"
          cp deploy/install.sh               "dist/$name/install.sh"
          chmod 755 "dist/$name/install.sh"
          cp README.md CHANGELOG.md LICENSE  "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist && sha256sum "$name.tar.gz" > SHA256SUMS && cat SHA256SUMS

      # Must run before the tag is created: `prev` has to be the *previous*
      # release, and `git tag -l` would otherwise hand back the tag this run is
      # about to create, leaving an empty range and empty notes.
      - name: Generate the release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          prev="$(git tag -l 'v*' --sort=-creatordate | head -1)"
          range="${prev:+$prev..}HEAD"
          # The changelog's own commits say nothing about the release; leave
          # them out of its notes. Anchored to the end of the subject, so a
          # commit that only mentions the marker in its body stays in.
          git log --no-merges --invert-grep --grep='\[skip ci\]$' --pretty='- %s (%h)' "$range" \
            | ./scripts/changelog-entry.sh "$TAG" "$DATE" > /tmp/entry.md
          cat /tmp/entry.md

      # The tag is the release, so it is pushed first and by itself: nothing
      # about the changelog can cost one.
      #
      # It names GITHUB_SHA explicitly -- the commit the tarball above was
      # built from -- so `git checkout <tag> && go build` reproduces the
      # release. It used to be created on the changelog commit, one commit
      # *ahead* of the build, so it never did.
      - name: Tag the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # Best effort, deliberately.
      #
      # The checkout is at github.sha. With merges A then B, run A pushing
      # HEAD:main from its own checkout is rejected: main is at B, which is
      # not a descendant of A's changelog commit. So apply the entry to
      # whatever main is *now* rather than to the commit this run was checked
      # out at. (dist/ is untracked, so the tarball survives the switch, and
      # `commit -am` cannot pick it up.)
      #
      # If even that loses -- a third merge landing inside this step's own
      # window -- warn and move on. $TAG is already pushed and Publish still
      # runs; the cost is one missing CHANGELOG.md entry, and since ranges are
      # tag-to-tag the next release's notes cover those commits anyway.
      - name: Update the changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B changelog-tmp FETCH_HEAD

          # Insert after the marker so the file's header survives.
          awk '
            { print }
            /^<!-- new releases are inserted directly below this line -->$/ && !done {
              print ""
              while ((getline line < "/tmp/entry.md") > 0) print line
              done = 1
            }
          ' CHANGELOG.md > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md

          if git diff --quiet -- CHANGELOG.md; then
            echo "::warning::CHANGELOG.md insertion marker not found; $TAG is released, changelog not updated"
            exit 0
          fi

          # [skip ci] keeps this commit out of this workflow: the `test` job's
          # `if` reads head_commit.message, and `release` needs test.
          git commit -am "Record $TAG in the changelog [skip ci]"
          git push origin HEAD:main \
            || echo "::warning::changelog push failed; $TAG is released, CHANGELOG.md not updated"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: /tmp/entry.md
          files: |
            dist/hindsight_${{ steps.version.outputs.tag }}_linux_arm64.tar.gz
            dist/SHA256SUMS

  # The hub (cmd/hindsight-hub, docs/hub.md) as an image, after the release
  # it is named for. Argo CD deploys deploy/hub from main, so the last step
  # points its kustomization at this image: the tag in git is what runs.
  hub-image:
    needs: release
    runs-on: ubuntu-24.04-arm # native arm64: no QEMU
    permissions:
      contents: write
      packages: write
    steps:
      # The release's own commit, so the image is what the tag says --
      # the same promise "Tag the release" makes for the tarball. Main has
      # moved on by at least the changelog commit; the last step deals with
      # that.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/hub/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: VERSION=${{ needs.release.outputs.tag }}
          tags: |
            ghcr.io/gabeduke/hindsight-hub:${{ needs.release.outputs.tag }}
            ghcr.io/gabeduke/hindsight-hub:latest
          cache-from: type=gha,scope=hindsight-hub
          cache-to: type=gha,scope=hindsight-hub,mode=max

      # Best effort, the way "Update the changelog" is, and for the same
      # reasons: this checkout is at the release's commit, not main's tip,
      # which by now carries at least the changelog commit and perhaps a
      # later merge. So the bump is applied to whatever main is *now*. If
      # the push still loses to a merge landing inside this step, warn and
      # move on: the image is pushed and the release stands; Argo keeps
      # running the previous tag until the next release bumps it.
      - name: Point the hub at the image
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B hub-image-tmp FETCH_HEAD

          if command -v kustomize >/dev/null; then
            (cd deploy/hub && kustomize edit set image "ghcr.io/gabeduke/hindsight-hub:$TAG")
          else
            # One image in the file, so its one newTag is this one.
            sed -i -E "s|^([[:space:]]*newTag:).*|\1 $TAG|" deploy/hub/kustomization.yaml
          fi

          if git diff --quiet -- deploy/hub/kustomization.yaml; then
            echo "::warning::deploy/hub/kustomization.yaml unchanged; the hub image $TAG is pushed but not deployed"
            exit 0
          fi

          # [skip ci], as for the changelog: the `test` job's `if` reads
          # head_commit.message, and `release` needs test.
          git commit -m "Point the hub at $TAG [skip ci]" -- deploy/hub/kustomization.yaml
          git push origin HEAD:main \
            || echo "::warning::hub image push to main failed; ghcr.io/gabeduke/hindsight-hub:$TAG is pushed, deploy/hub not updated"
