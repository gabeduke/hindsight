# No forward-auth: the device tokens are the hub's auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hindsight-hub
  annotations:
    kubernetes.io/ingress.class: traefik
    ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-aws-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [hub.hindsight.leetserve.com]
      secretName: hindsight-hub-tls
  rules:
    - host: hub.hindsight.leetserve.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hindsight-hub
                port:
                  name: http
