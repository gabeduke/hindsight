<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hindsight — take</title>
<meta name="theme-color" content="#e4e3dd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141516" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-small.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png?v=3" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Cross-fade between pages (styles.css, "motion between pages"). Inline,
     so the new page has opted in by the time it first paints. -->
<style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
<link rel="stylesheet" href="/objects.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/css/chrome.css">
<link rel="stylesheet" href="/css/bar.css">
<link rel="stylesheet" href="/css/rooms-motion.css">
</head>
<body class="wave-page">

<!-- The header: three zones, as on every page (css/chrome.css). At the
     start, the way back and the take: its name, which is its menu (the
     takes before and after it, the downloads, Delete), its star and its tag.
     Studio | Listening Room in the middle, where it is in the rooms; ↶ and
     ☰ at the end. -->
<header class="appbar">
  <div class="appbar-start">
    <a class="brand" href="/" data-tip="home"><img src="/icons/icon-small.svg?v=3" alt=""><b>Hindsight</b></a>
    <div class="appbar-page take-head-row">
      <a class="back" href="/takes.html" aria-label="Back to takes" data-tip="back"><svg class="i i-left" width="22" height="22" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#left"/></svg><span class="back-text">Takes</span></a>
      <span class="menu-anchor take-name-anchor">
        <button id="take-name" class="tape-pill ctx-pill take-title-name" type="button" data-tip="take-menu"><span id="take-name-text" class="pill-text">…</span><span class="pill-chev" aria-hidden="true"><svg class="i i-down" width="12" height="12" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#down"/></svg></span></button>
        <input id="take-name-input" class="take-title-input" type="text" maxlength="120" hidden aria-label="Take name">
      </span>
      <button id="take-star" class="star take-star" type="button" aria-pressed="false" aria-label="Star this take" data-tip="star"><svg class="i i-star" width="22" height="22" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#star"/></svg></button>
    </div>
  </div>
  <!-- The switch between the two rooms; on a phone, tabs along the
       bottom (lib/nav.js keeps it true). -->
  <nav class="appnav" aria-label="Pages">
    <a href="/" data-tab="studio" data-tip="nav-studio"><span class="appnav-ico" aria-hidden="true"><svg class="i i-studio" width="20" height="20" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#studio"/></svg><span class="appnav-lamp"></span></span>Studio</a>
    <a href="/takes.html" data-tab="room" data-tip="nav-room" aria-current="page"><span class="appnav-ico" aria-hidden="true"><svg class="i i-shelf" width="20" height="20" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#shelf"/></svg></span>Listening Room</a>
  </nav>
  <div class="appbar-end">
    <button id="take-undo" class="icon-btn undo-btn" type="button" disabled aria-label="Undo" data-tip="undo"><svg class="i i-undo" width="22" height="22" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#undo"/></svg></button>
  </div>
  <!-- Help mode: lib/nav.js moves it into the header's menu as the page
       starts (lib/help/help.js has it by its id). -->
  <button id="help" class="icon-btn help-btn" type="button" aria-pressed="false" aria-label="Help" data-tip="help">?</button>
</header>
<!-- The take's menu, from its name (lib/ui/menu.js; lib/wave/page.js
     takeMenu): rename it; the takes either side of it in the list, each by
     its name; the downloads; the downbeat back to the start; on a phone,
     its MIDI and its tag; and Delete, last. -->
<div id="take-menu" class="menu take-menu" role="menu" aria-label="This take" hidden>
  <button id="take-rename" class="menu-item" type="button" role="menuitem" data-tip="rename"><span class="menu-word">Rename…</span></button>
  <div class="menu-divider" role="separator"></div>
  <button id="take-prev" class="menu-item" type="button" role="menuitem" data-tip="take-prev" disabled><span class="menu-word">Previous take</span><span id="take-prev-name" class="menu-sub"></span></button>
  <button id="take-next" class="menu-item" type="button" role="menuitem" data-tip="take-next" disabled><span class="menu-word">Next take</span><span id="take-next-name" class="menu-sub"></span></button>
  <div class="menu-divider" role="separator"></div>
  <a id="take-dl-wav" class="menu-item" role="menuitem" download data-tip="dl-wav"><span class="menu-word">Download WAV</span><span class="menu-sub">the whole take, as recorded</span></a>
  <a id="take-dl-midi" class="menu-item" role="menuitem" download hidden data-tip="dl-midi"><span class="menu-word">Download MIDI</span><span class="menu-sub">what the keys played, with it</span></a>
  <button id="downbeat-reset" class="menu-item" type="button" role="menuitem" data-tip="downbeat-reset"><span class="menu-word">Reset the downbeat</span><span class="menu-sub">bar 1 back at the start</span></button>
  <!-- On a phone: the take's notes as they rise (the pane beside the
       waveform on a wider screen), and its tag (beside its star there). -->
  <button id="notes-open" class="menu-item notes-btn" type="button" role="menuitem" hidden data-tip="notes-open"><span class="menu-word">MIDI</span><span class="menu-sub">the notes, rising as it plays</span></button>
  <button id="take-tag-row" class="menu-item take-tag-row" type="button" role="menuitem" data-tip="take-tag"><span class="menu-word">Tag…</span></button>
  <div class="menu-divider" role="separator"></div>
  <button id="take-trash" class="menu-item danger" type="button" role="menuitem" disabled data-tip="take-trash"><span class="menu-word">Delete this take</span><span class="menu-sub">to Recently deleted, with Undo</span></button>
</div>

<main class="wave-main">
  <div class="wave-col" data-hints>
    <!-- What the list row says of a take, under the header: its tempo (a
         tap sets it), its length, its dropouts and what it was cut from. -->
    <div class="take-sub">
      <button id="take-bpm" class="take-sub-bpm" type="button" data-tip="bpm">+ bpm</button>
      <input id="take-bpm-input" class="take-sub-input" type="text" inputmode="decimal" maxlength="7" hidden aria-label="Tempo in BPM">
      <span id="take-len" class="take-sub-len mono"></span>
      <span id="take-drops" class="take-sub-drops" hidden></span>
      <a id="take-source" class="take-sub-src" hidden data-tip="source"></a>
    </div>
    <div id="wave-error" class="wave-error" hidden></div>
    <canvas id="wave-canvas" class="wave-canvas" aria-label="Waveform" data-tip="waveform"></canvas>

    <div class="toolbar">
      <div id="sel-row" class="tb-row selection" hidden>
        <span class="sel-edge">
          <span class="sel-label">In</span>
          <button id="in-dec" class="nudge" type="button" aria-label="In earlier" data-tip="nudge">◂</button>
          <span id="sel-in" class="mono sel-time" role="button" tabindex="0" data-tip="be-open"></span>
          <button id="in-inc" class="nudge" type="button" aria-label="In later" data-tip="nudge">▸</button>
        </span>
        <span id="sel-len" class="mono sel-len"></span>
        <span class="sel-edge">
          <span class="sel-label">Out</span>
          <button id="out-dec" class="nudge" type="button" aria-label="Out earlier" data-tip="nudge">◂</button>
          <span id="sel-out" class="mono sel-time" role="button" tabindex="0" data-tip="be-open"></span>
          <button id="out-inc" class="nudge" type="button" aria-label="Out later" data-tip="nudge">▸</button>
        </span>
        <button id="sel-clear" class="linkish sel-clear" type="button" data-tip="clear">Clear</button>
      </div>

      <!-- The downbeat (bar 1), once the take has a tempo: always here, not
           behind the ruler's "1". Set to the playhead, nudge, or tap the time
           to place it exactly. -->
      <div id="db-row" class="tb-row downbeat" hidden>
        <span class="sel-label">Downbeat</span>
        <button id="db-dec" class="nudge" type="button" aria-label="Downbeat earlier" data-tip="db-nudge">◂</button>
        <span id="db-time" class="mono sel-time" role="button" tabindex="0" data-tip="db-open"></span>
        <button id="db-inc" class="nudge" type="button" aria-label="Downbeat later" data-tip="db-nudge">▸</button>
        <button id="db-set" class="icon-btn" type="button" data-tip="db-set">Set to playhead</button>
      </div>

      <!-- The boundary editor (lib/wave/page.js, "the boundary editor"): while
           In, Out or the downbeat is being edited this takes the place of the rows
           around it. Two encoder pads, the snaps and the steps. -->
      <div id="boundary-editor" class="boundary-editor" hidden>
        <div class="be-head">
          <span id="boundary-readout" class="mono be-readout"></span>
          <button id="be-done" class="icon-btn" type="button" data-tip="be-done">Done</button>
        </div>
        <div id="be-zoom" class="be-pad" role="slider" tabindex="0" aria-label="Zoom about the point" data-tip="be-zoom"><span>ZOOM</span></div>
        <div id="be-pos" class="be-pad" role="slider" tabindex="0" aria-label="Move the point" data-tip="be-pos"><span>POSITION</span></div>
        <div class="tb-row be-keys">
          <div class="be-group be-snaps">
            <button id="be-attack" class="icon-btn" type="button" data-tip="be-attack">Attack</button>
            <button id="be-zero" class="icon-btn" type="button" data-tip="be-zero">Zero</button>
            <button id="be-grid" class="icon-btn" type="button" data-tip="be-grid">Grid</button>
          </div>
          <div class="be-group be-moves">
            <button id="be-back" class="nudge" type="button" aria-label="Back one step" data-tip="be-step">◂</button>
            <span id="be-step" class="mono be-step"></span>
            <button id="be-fwd" class="nudge" type="button" aria-label="On one step" data-tip="be-step">▸</button>
            <button id="be-play" class="icon-btn" type="button" aria-label="Play from here" data-tip="be-play">▶</button>
            <button id="be-seam" class="icon-btn" type="button" aria-pressed="false" data-tip="be-seam">Seam</button>
          </div>
        </div>
      </div>

      <div class="tb-row verbs">
        <button id="save-take" class="icon-btn" type="button" disabled data-tip="save-take">Save as take</button>
        <!-- Send to: the selection, or the whole take, onto the tape or the
             clipboard. One menu, as everywhere a selection can
             go (docs/superpowers/specs/2026-10-08-interaction-model-design.md). -->
        <button id="send-btn" class="icon-btn" type="button" hidden aria-haspopup="menu" aria-expanded="false" data-tip="send-to">Send to<span aria-hidden="true"> ▾</span></button>
        <div id="send-menu" class="menu menu-up send-menu" role="menu" hidden>
          <button id="send-to-tape" type="button" role="menuitem" data-tip="send-to-tape"><b>Tape</b><span id="send-hint" class="menu-sub"></span></button>
          <button id="copy-take" type="button" role="menuitem" data-tip="send-clipboard"><b>Clipboard</b><span class="menu-sub">To Drop or Insert on a tape</span></button>
        </div>
        <button id="share" class="icon-btn primary" type="button" data-tip="share">Share</button>
        <button id="more-btn" class="icon-btn" type="button" aria-haspopup="menu" aria-expanded="false" data-tip="more">More</button>
        <div id="more-menu" class="menu menu-up" role="menu" hidden>
          <button id="bundle" type="button" role="menuitem" data-tip="bundle">DAW bundle</button>
          <a id="dl-wav" role="menuitem" download data-tip="dl-wav">Download WAV</a>
          <a id="dl-midi" role="menuitem" download hidden data-tip="dl-midi">Download MIDI</a>
          <button id="delete-take" class="danger" type="button" role="menuitem" data-tip="delete">Delete take</button>
        </div>
      </div>
      <!-- Save as take asks for the new take's name first, in the verbs' place. -->
      <form id="save-name" class="tb-row save-name" hidden>
        <input id="save-name-input" type="text" maxlength="120" autocomplete="off" enterkeyhint="done" aria-label="Name the new take" data-tip="save-name">
        <button id="save-name-ok" class="icon-btn primary" type="submit" aria-label="Save the new take" data-tip="save-name">Save</button>
        <button id="save-name-cancel" class="icon-btn" type="button" aria-label="Cancel: save nothing" data-tip="save-name">Cancel</button>
      </form>

      <div class="tb-row footer">
        <span class="step-group">
          <button id="flag-prev" class="icon-btn tb-step" type="button" aria-label="Previous flag" data-tip="flag-prev">◂⚑</button>
          <button id="flag-next" class="icon-btn tb-step" type="button" aria-label="Next flag" data-tip="flag-next">⚑▸</button>
        </span>
        <!-- The take's flags as a list: tap one to play from it. -->
        <button id="flags-list" class="chip" type="button" aria-haspopup="dialog" data-tip="flags-list"><span aria-hidden="true">⚑</span> <span id="flags-count">0</span></button>
        <button id="snap" class="chip" type="button" hidden data-tip="snap">Snap: off</button>
        <div id="speed" class="seg speed-seg" role="group" aria-label="Practice speed" data-tip="speed">
          <button type="button" data-rate="0.5" aria-pressed="false" data-tip="speed">½×</button>
          <button type="button" data-rate="1" aria-pressed="true" data-tip="speed">1×</button>
          <button type="button" data-rate="2" aria-pressed="false" data-tip="speed">2×</button>
        </div>
        <!-- Normalize: plays the take, and shares it, with its loudest moment
             a decibel under full scale (GET /api/level). -->
        <button id="level" class="chip level-chip" type="button" aria-pressed="false" aria-label="Level" aria-describedby="level-gain" data-tip="level">Level</button>
        <span id="level-gain" class="sr-only" role="status"></span>
      </div>
    </div>

    <!-- One lane per MIDI track, built by lib/wave/lanes.js when the take has
         a .mid; stays empty and takes no space otherwise. Below the toolbar,
         so the transport stays in reach on a phone. -->
    <div id="lanes" class="lanes" hidden></div>
  </div>

  <!-- Rising notes: the take's MIDI coming out of a keyboard as it plays.
       On a bench-width screen it is the right column; on a phone it opens
       fullscreen from the Notes button, with a strip of the waveform above. -->
  <section id="notes-pane" class="notes-pane" hidden aria-label="Rising notes">
    <canvas id="notes-strip" class="notes-strip phone-only" aria-hidden="true"></canvas>
    <div class="notes-chips">
      <div id="notes-tracks" class="notes-tracks"></div>
      <button id="notes-speed" class="chip" type="button" aria-label="Practice speed" data-tip="speed">1×</button>
      <span id="notes-bar" class="mono notes-bar phone-only"></span>
      <button id="notes-play" class="icon-btn phone-only" type="button" data-tip="play">Play</button>
    </div>
    <canvas id="notes-canvas" class="notes-canvas" aria-label="Rising notes"></canvas>
  </section>
</main>

<!-- The bar (css/bar.css), in the shape it has in the rooms: the deck, the
     transport, the modes and, at its end, this page's own keys -- In, Out,
     ⚑; under them the whole take as a scrubber. A take plays here, on this
     device, and the display says so (lib/wave/page.js). -->
<section id="np" class="np" aria-label="Now playing" data-source="take" data-size="full">
  <div class="np-row np-row-1">
    <div class="np-zones">
      <div class="np-window" data-slot="deck">
        <button id="np-expand" class="np-expand" type="button" aria-expanded="false" aria-label="Open the player" data-tip="np-expand" data-tip-pass></button>
        <svg id="np-reel-l" class="np-reel" viewBox="0 0 160 160" aria-hidden="true"></svg>
        <div class="np-lcd" role="group" aria-label="The display">
          <div class="np-lcd-pos">
            <div class="np-lcd-top">
              <span id="np-status" class="np-status" data-state="pause" aria-hidden="true"></span>
              <span id="np-unit" class="np-unit" aria-hidden="true"></span>
              <span id="position" class="np-pos"></span>
              <span id="np-levels" class="np-levels" aria-hidden="true"></span>
            </div>
            <div class="np-lcd-sub"><span id="np-time" class="np-time"></span></div>
          </div>
          <span class="np-lcd-key np-tempo"><span class="np-lcd-val"><span id="np-tempo-short" class="np-short">–</span><span id="np-tempo-long" class="np-long">–</span></span><span class="np-lcd-leg"><span class="np-short">BPM</span><span class="np-long">TEMPO</span></span></span>
          <span class="np-lcd-key np-source"><span class="np-lcd-val"><span id="np-source-short" class="np-short"></span><span id="np-source-long" class="np-long"></span></span><span class="np-lcd-leg">SOURCE</span></span>
          <span class="np-lcd-key np-output"><span class="np-lcd-val"><span id="np-output-val"></span></span><span class="np-lcd-leg">OUT</span></span>
        </div>
        <svg id="np-reel-r" class="np-reel" viewBox="0 0 160 160" aria-hidden="true"></svg>
      </div>
      <div class="np-zone np-transport" data-slot="transport" role="group" aria-label="Transport">
        <button id="to-start" class="icon-btn np-start" type="button" aria-label="Back to In" data-tip="take-to-start" data-for="take" data-mini="take"><svg class="i i-prev" width="20" height="20" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#prev"/></svg></button>
        <button id="play" class="icon-btn tb-play" type="button" aria-label="Play" data-tip="play" data-for="take" data-mini="take"><svg class="i i-play" width="22" height="22" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#play"/></svg></button>
        <button id="back5" class="icon-btn np-back5" type="button" aria-label="Back 5 seconds" aria-keyshortcuts="J" data-tip="back5" data-for="take"><svg class="i i-back5" width="20" height="20" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#back5"/></svg></button>
      </div>
      <div class="np-zone np-verb" data-slot="verb"></div>
      <div class="np-zone np-modes" data-slot="modes" role="group" aria-label="Modes">
        <button id="loop" class="icon-btn tb-loop" type="button" aria-pressed="false" data-tip="loop" data-for="take"><span class="loop-face"><svg class="i i-repeat" width="16" height="16" aria-hidden="true"><use href="/icons/ui.svg?v=5157df85#repeat"/></svg><span class="loop-word">Repeat</span></span></button>
      </div>
      <div class="np-zone np-end" data-slot="end">
        <button id="set-in" class="icon-btn tb-point" type="button" data-tip="in" data-for="take">In</button>
        <button id="set-out" class="icon-btn tb-point" type="button" data-tip="out" data-for="take">Out</button>
        <button id="flag-now" class="icon-btn tb-flag" type="button" aria-label="Flag" data-tip="flag" data-for="take">⚑</button>
      </div>
    </div>
  </div>
  <div class="np-row np-row-2" data-slot="strip">
    <canvas id="overview-canvas" class="overview-canvas np-scrub" role="slider" tabindex="0" aria-label="The whole take: tap to move the playhead, drag the box to move the view" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" data-tip="overview" data-for="take"></canvas>
  </div>
</section>

<!-- The take's flags, in time order (lib/shelf.js flagChips): a tap plays
     from one. -->
<dialog class="sheet" id="flags-sheet" aria-labelledby="flags-title">
  <div class="sheet-inner">
    <h3 id="flags-title">Flags</h3>
    <ul id="flags-items" class="flags-items"></ul>
    <p id="flags-none" class="flags-none" hidden>No flags yet. ⚑, or F, drops one at the playhead.</p>
    <div class="sheet-actions">
      <button id="flags-done" class="icon-btn" type="button">Done</button>
    </div>
  </div>
</dialog>

<div id="flag-sheet" class="sheet" hidden>
  <input id="flag-label" type="text" maxlength="120" placeholder="name this moment" aria-label="Flag name">
  <button id="flag-delete" class="icon-btn danger" type="button" data-tip="flag-delete">Delete</button>
  <button id="flag-done" class="icon-btn" type="button">Done</button>
</div>

<div id="toasts" aria-live="polite"></div>
<script type="module" src="/lib/wave/page.js"></script>
</body>
</html>
