<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hindsight — take</title>
<meta name="theme-color" content="#e4e3dd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141516" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="wave-page">

<!-- The take's header: the same controls the list row has (name, star,
     tempo), so nothing about a take can only be changed from one page. -->
<header class="appbar take-top">
  <a class="brand" href="/" data-tip="home"><img src="/icons/icon-192.png" alt=""><b>Hindsight</b></a>
  <!-- The switch between the three pages; on a phone, tabs along the
       bottom (lib/nav.js keeps it true). -->
  <nav class="appnav" aria-label="Pages">
    <a href="/" data-tab="capture" data-tip="nav-capture"><span class="appnav-lamp" aria-hidden="true"></span>Capture</a>
    <a href="/takes.html" data-tab="takes" data-tip="nav-takes" aria-current="page"><svg class="appnav-ico" width="20" height="18" viewBox="0 0 20 18" aria-hidden="true"><path d="M2 3h16M2 9h16M2 15h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Takes</a>
    <a href="/tape.html" data-tab="tape" data-tip="nav-tape"><svg class="appnav-ico" width="24" height="18" viewBox="0 0 24 18" aria-hidden="true"><circle cx="6" cy="9" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="9" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 13.5h12" stroke="currentColor" stroke-width="2"/></svg>Tape</a>
  </nav>
  <button id="help" class="icon-btn help-btn" type="button" aria-pressed="false" aria-label="Help" data-tip="help">?</button>
  <div class="appbar-page">
    <a class="back" href="/takes.html" aria-label="Back to takes" data-tip="back"><span aria-hidden="true">‹</span><span class="back-text">Takes</span></a>
    <div class="take-title">
      <div class="take-title-row">
        <button id="take-name" class="take-title-name" type="button" data-tip="rename">…</button>
        <input id="take-name-input" class="take-title-input" type="text" maxlength="120" hidden aria-label="Take name">
        <button id="take-star" class="star" type="button" aria-pressed="false" aria-label="Star this take" data-tip="star">★</button>
      </div>
      <div class="take-sub">
        <button id="take-bpm" class="take-sub-bpm" type="button" data-tip="bpm">+ bpm</button>
        <input id="take-bpm-input" class="take-sub-input" type="text" inputmode="decimal" maxlength="7" hidden aria-label="Tempo in BPM">
        <span id="take-len" class="take-sub-len mono"></span>
        <a id="take-source" class="take-sub-src" hidden data-tip="source"></a>
      </div>
    </div>
    <span class="step-group">
      <button id="take-prev" class="icon-btn step-btn" type="button" aria-label="Previous take" data-tip="take-prev" disabled>◂</button>
      <button id="take-next" class="icon-btn step-btn" type="button" aria-label="Next take" data-tip="take-next" disabled>▸</button>
    </span>
    <span class="appbar-spacer"></span>
    <!-- Phone only: opens the rising-notes pane fullscreen. Revealed once
         /api/midi has returned tracks; on the bench the pane is always there. -->
    <button id="notes-open" class="icon-btn notes-btn" type="button" hidden aria-label="Notes" data-tip="notes-open"><span class="wide-only">Notes</span><span class="narrow-only">♪</span></button>
    <button id="take-undo" class="icon-btn undo-btn" type="button" disabled aria-label="Undo" data-tip="undo">↶</button>
    <span class="menu-anchor">
      <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More options" data-tip="menu">⋯</button>
      <div id="take-menu" class="menu" role="menu" hidden>
        <button id="downbeat-reset" type="button" role="menuitem" data-tip="downbeat-reset">Reset the downbeat</button>
        <a href="/guide.html#4-the-take-page" role="menuitem" data-tip="guide">The guide</a>
      </div>
    </span>
  </div>
</header>

<main class="wave-main">
  <div class="wave-col" data-hints>
    <div id="wave-error" class="wave-error" hidden></div>
    <canvas id="wave-canvas" class="wave-canvas" aria-label="Waveform" data-tip="waveform"></canvas>

    <div class="toolbar">
      <div id="sel-row" class="tb-row selection" hidden>
        <span class="sel-edge">
          <span class="sel-label">In</span>
          <button id="in-dec" class="nudge" type="button" aria-label="In earlier" data-tip="nudge">◂</button>
          <span id="sel-in" class="mono sel-time" role="button" tabindex="0" data-tip="be-open"></span>
          <button id="in-inc" class="nudge" type="button" aria-label="In later" data-tip="nudge">▸</button>
        </span>
        <span id="sel-len" class="mono sel-len"></span>
        <span class="sel-edge">
          <span class="sel-label">Out</span>
          <button id="out-dec" class="nudge" type="button" aria-label="Out earlier" data-tip="nudge">◂</button>
          <span id="sel-out" class="mono sel-time" role="button" tabindex="0" data-tip="be-open"></span>
          <button id="out-inc" class="nudge" type="button" aria-label="Out later" data-tip="nudge">▸</button>
        </span>
        <button id="sel-clear" class="linkish sel-clear" type="button" data-tip="clear">Clear</button>
      </div>

      <!-- The boundary editor (lib/wave/page.js, "the boundary editor"): while
           In, Out or bar 1 is being edited this takes the place of the rows
           around it. Two encoder pads, the snaps and the steps. -->
      <div id="boundary-editor" class="boundary-editor" hidden>
        <div class="be-head">
          <span id="boundary-readout" class="mono be-readout"></span>
          <button id="be-done" class="icon-btn" type="button" data-tip="be-done">Done</button>
        </div>
        <div id="be-zoom" class="be-pad" role="slider" tabindex="0" aria-label="Zoom about the point" data-tip="be-zoom"><span>ZOOM</span></div>
        <div id="be-pos" class="be-pad" role="slider" tabindex="0" aria-label="Move the point" data-tip="be-pos"><span>POSITION</span></div>
        <div class="tb-row be-keys">
          <div class="be-group be-snaps">
            <button id="be-attack" class="icon-btn" type="button" data-tip="be-attack">Attack</button>
            <button id="be-zero" class="icon-btn" type="button" data-tip="be-zero">Zero</button>
            <button id="be-grid" class="icon-btn" type="button" data-tip="be-grid">Grid</button>
          </div>
          <div class="be-group be-moves">
            <button id="be-back" class="nudge" type="button" aria-label="Back one step" data-tip="be-step">◂</button>
            <span id="be-step" class="mono be-step"></span>
            <button id="be-fwd" class="nudge" type="button" aria-label="On one step" data-tip="be-step">▸</button>
            <button id="be-play" class="icon-btn" type="button" aria-label="Play from here" data-tip="be-play">▶</button>
            <button id="be-seam" class="icon-btn" type="button" aria-pressed="false" data-tip="be-seam">Seam</button>
          </div>
        </div>
      </div>

      <div class="tb-row verbs">
        <button id="save-take" class="icon-btn" type="button" disabled data-tip="save-take">Save as take</button>
        <button id="send-to-tape" class="icon-btn" type="button" hidden data-tip="send-to-tape">Send to tape</button>
        <button id="share" class="icon-btn primary" type="button" data-tip="share">Share</button>
        <button id="more-btn" class="icon-btn" type="button" aria-haspopup="menu" aria-expanded="false" data-tip="more">More</button>
        <div id="more-menu" class="menu menu-up" role="menu" hidden>
          <button id="bundle" type="button" role="menuitem" data-tip="bundle">DAW bundle</button>
          <a id="dl-wav" role="menuitem" download data-tip="dl-wav">Download WAV</a>
          <a id="dl-midi" role="menuitem" download hidden data-tip="dl-midi">Download MIDI</a>
          <button id="copy-take" type="button" role="menuitem" hidden data-tip="copy">Copy</button>
          <button id="delete-take" class="danger" type="button" role="menuitem" data-tip="delete">Delete take</button>
        </div>
      </div>

      <div class="tb-row footer">
        <span class="step-group">
          <button id="flag-prev" class="icon-btn tb-step" type="button" aria-label="Previous flag" data-tip="flag-prev">◂⚑</button>
          <button id="flag-next" class="icon-btn tb-step" type="button" aria-label="Next flag" data-tip="flag-next">⚑▸</button>
        </span>
        <button id="snap" class="chip" type="button" hidden data-tip="snap">Snap: off</button>
        <div id="speed" class="seg speed-seg" role="group" aria-label="Practice speed" data-tip="speed">
          <button type="button" data-rate="0.5" aria-pressed="false" data-tip="speed">½×</button>
          <button type="button" data-rate="1" aria-pressed="true" data-tip="speed">1×</button>
          <button type="button" data-rate="2" aria-pressed="false" data-tip="speed">2×</button>
        </div>
      </div>
    </div>

    <!-- One lane per MIDI track, built by lib/wave/lanes.js when the take has
         a .mid; stays empty and takes no space otherwise. Below the toolbar,
         so the transport stays in reach on a phone. -->
    <div id="lanes" class="lanes" hidden></div>
  </div>

  <!-- Rising notes: the take's MIDI coming out of a keyboard as it plays.
       On a bench-width screen it is the right column; on a phone it opens
       fullscreen from the Notes button, with a strip of the waveform above. -->
  <section id="notes-pane" class="notes-pane" hidden aria-label="Rising notes">
    <canvas id="notes-strip" class="notes-strip phone-only" aria-hidden="true"></canvas>
    <div class="notes-chips">
      <div id="notes-tracks" class="notes-tracks"></div>
      <button id="notes-speed" class="chip" type="button" aria-label="Practice speed" data-tip="speed">1×</button>
      <span id="notes-bar" class="mono notes-bar phone-only"></span>
      <button id="notes-play" class="icon-btn phone-only" type="button" data-tip="play">Play</button>
    </div>
    <canvas id="notes-canvas" class="notes-canvas" aria-label="Rising notes"></canvas>
  </section>
</main>

<!-- The now-playing bar (docs/superpowers/specs/2026-10-05-transport-bar-design.md),
     as on the tape page: the reel window and its LCD, ▶ and Loop, and this
     page's own keys -- In, Out, ⚑; under them the whole take as a scrubber.
     A take plays here, on this device. -->
<section id="np" class="np" aria-label="Now playing">
  <div class="np-row np-row-1">
    <div class="np-window">
      <svg id="np-reel-l" class="np-reel" viewBox="0 0 160 160" aria-hidden="true"></svg>
      <div class="np-lcd">
        <div class="np-lcd-top">
          <span id="np-status" class="np-status" data-state="pause" aria-hidden="true"></span>
          <span id="np-unit" class="np-unit" aria-hidden="true"></span>
          <span id="position" class="np-pos"></span>
          <span id="np-time" class="np-time"></span>
          <span id="np-levels" class="np-levels" aria-hidden="true"></span>
        </div>
        <div class="np-marquee" aria-hidden="true"><span id="np-marquee"></span></div>
      </div>
      <svg id="np-reel-r" class="np-reel" viewBox="0 0 160 160" aria-hidden="true"></svg>
    </div>
    <div class="np-keys tb-row transport" role="group" aria-label="Transport">
      <button id="to-start" class="icon-btn np-start" type="button" aria-label="Back to In" data-tip="take-to-start"><svg width="18" height="16" viewBox="0 0 24 22" aria-hidden="true"><rect x="4" y="3" width="3" height="16" rx="1" fill="currentColor"/><path d="M20 4.2v13.6a1 1 0 0 1-1.55.84L9 12.84a1 1 0 0 1 0-1.68l9.45-6.8A1 1 0 0 1 20 4.2z" fill="currentColor"/></svg></button>
      <button id="play" class="icon-btn tb-play" type="button" aria-label="Play" data-tip="play">▶</button>
      <button id="loop" class="icon-btn tb-loop" type="button" aria-pressed="false" data-tip="loop">⟲ Loop</button>
    </div>
    <div class="np-own">
      <button id="set-in" class="icon-btn tb-point" type="button" data-tip="in">In</button>
      <button id="set-out" class="icon-btn tb-point" type="button" data-tip="out">Out</button>
      <button id="flag-now" class="icon-btn tb-flag" type="button" aria-label="Flag" data-tip="flag">⚑</button>
    </div>
  </div>
  <div class="np-row np-row-2">
    <span id="np-mini" class="np-mini" aria-hidden="true"></span>
    <canvas id="overview-canvas" class="overview-canvas np-scrub" role="slider" tabindex="0" aria-label="The whole take: tap to move the playhead, drag the box to move the view" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" data-tip="overview"></canvas>
    <span class="np-out np-here"><span class="pill-out" aria-hidden="true">OUT</span><span>This device</span></span>
  </div>
</section>

<div id="flag-sheet" class="sheet" hidden>
  <input id="flag-label" type="text" maxlength="120" placeholder="name this moment" aria-label="Flag name">
  <button id="flag-delete" class="icon-btn danger" type="button" data-tip="flag-delete">Delete</button>
  <button id="flag-done" class="icon-btn" type="button">Done</button>
</div>

<div id="toasts" aria-live="polite"></div>
<script type="module" src="/lib/wave/page.js"></script>
</body>
</html>
