<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hindsight — take</title>
<meta name="theme-color" content="#0b1120">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="wave-page">

<header class="topbar">
  <a class="back" href="/" aria-label="Back to takes">‹</a>
  <div class="wave-title">
    <span id="wave-name" class="wave-name">…</span>
    <span id="wave-bpm" class="wave-bpm"></span>
  </div>
  <!-- Phone only: opens the rising-notes pane fullscreen. Revealed by
       page.js once /api/midi has returned tracks, so a take without MIDI
       never offers a view of nothing. On the bench the pane is always
       there and this stays hidden. -->
  <button id="notes-open" class="icon-btn notes-btn" type="button" hidden>Notes</button>
</header>

<main class="wave-main">
  <div class="wave-col">
    <div id="wave-error" class="wave-error" hidden></div>
    <canvas id="overview-canvas" class="overview-canvas" aria-label="Whole take"></canvas>
    <canvas id="wave-canvas" class="wave-canvas" aria-label="Waveform"></canvas>

    <!-- One lane per MIDI track, built by lib/wave/lanes.js when the take has
         a .mid; stays empty and takes no space otherwise. -->
    <div id="lanes" class="lanes" hidden></div>

    <div class="wave-row action">
      <button id="play" class="icon-btn" type="button">Play</button>
      <button id="bundle" class="icon-btn" type="button">DAW bundle</button>
      <button id="share" class="icon-btn primary" type="button">Share MP3</button>
      <button id="region-clear" class="region-x" type="button" aria-label="Clear region" hidden>×</button>
    </div>

    <details id="fine" class="fine">
      <summary>Fine tune</summary>
      <div class="fine-grid">
        <span class="fine-label">Region</span>
        <span id="region-length" class="mono fine-hint">—</span>
        <span class="fine-label">Start</span>
        <span class="edge">
          <button id="start-dec" class="nudge" type="button" aria-label="Region start earlier">−</button>
          <button id="start-inc" class="nudge" type="button" aria-label="Region start later">+</button>
        </span>
        <span class="fine-label">End</span>
        <span class="edge">
          <button id="end-dec" class="nudge" type="button" aria-label="Region end earlier">−</button>
          <button id="end-inc" class="nudge" type="button" aria-label="Region end later">+</button>
        </span>
        <span class="fine-label">Position</span>
        <span class="readout"><span id="pos-bar" class="mono"></span> <span id="pos-time" class="mono"></span></span>
        <span class="fine-label">Waveform</span>
        <label class="fine-hint fine-check"><input id="fit-peak" type="checkbox"> fit quiet takes to the height</label>
        <span class="fine-label">Downbeat</span>
        <span class="fine-hint">drag the marker on the waveform · <button id="downbeat-reset" class="linkish" type="button">reset</button></span>
        <span class="fine-label"></span>
        <span class="edge">
          <button id="export" class="icon-btn" type="button" disabled>Export as take</button>
          <button id="region-delete" class="icon-btn danger" type="button" disabled>Delete region</button>
        </span>
      </div>
    </details>
  </div>

  <!-- Rising notes: the take's MIDI coming out of a keyboard as it plays.
       Built by lib/wave/rising.js from the same /api/midi response as the
       lanes. On a bench-width screen it is the right column; on a phone
       it opens fullscreen from the Notes button. -->
  <section id="notes-pane" class="notes-pane" hidden aria-label="Rising notes">
    <div class="notes-chips">
      <div id="notes-tracks" class="notes-tracks"></div>
      <button id="notes-speed" class="chip" type="button" aria-label="Playback speed">1×</button>
      <span id="notes-bar" class="mono notes-bar phone-only"></span>
      <button id="notes-play" class="icon-btn phone-only" type="button">Play</button>
    </div>
    <canvas id="notes-canvas" class="notes-canvas" aria-label="Rising notes"></canvas>
  </section>
</main>

<div id="flag-sheet" class="sheet" hidden>
  <input id="flag-label" type="text" maxlength="120" placeholder="name this moment">
  <button id="flag-delete" class="icon-btn danger" type="button">Delete</button>
  <button id="flag-done" class="icon-btn" type="button">Done</button>
</div>

<div id="toasts" aria-live="polite"></div>
<script type="module" src="/lib/wave/page.js"></script>
</body>
</html>
