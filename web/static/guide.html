<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hindsight guide</title>
<meta name="theme-color" content="#e4e3dd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141516" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-small.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png?v=3" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
<!-- Cross-fade between pages (styles.css, "motion between pages"). Inline,
     so the new page has opted in by the time it first paints. -->
<style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
<link rel="stylesheet" href="/objects.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/css/chrome.css">
<link rel="stylesheet" href="/css/rooms-motion.css">
</head>
<body class="guide-page">
<header class="appbar">
  <!-- Three zones, as on every page (css/chrome.css): the way back and the
       page's name; Studio | Listening Room; ☰ (lib/nav.js). -->
  <div class="appbar-start">
    <a class="brand" href="/" data-tip="home"><img src="/icons/icon-small.svg?v=3" alt=""><b>Hindsight</b></a>
    <div class="appbar-page">
      <a class="back" href="/" aria-label="Back to Hindsight"><svg class="i i-left" width="22" height="22" aria-hidden="true"><use href="/icons/ui.svg?v=c634899d#left"/></svg><span class="back-text">Back</span></a>
      <h1 class="guide-title">The guide</h1>
    </div>
  </div>
  <!-- The switch between the two rooms; on a phone, tabs along the
       bottom (lib/nav.js keeps it true). -->
  <nav class="appnav" aria-label="Pages">
    <a href="/" data-tab="studio" data-tip="nav-studio"><span class="appnav-ico" aria-hidden="true"><svg class="i i-studio" width="20" height="20" aria-hidden="true"><use href="/icons/ui.svg?v=c634899d#studio"/></svg><span class="appnav-lamp"></span></span>Studio</a>
    <a href="/takes.html" data-tab="room" data-tip="nav-room"><span class="appnav-ico" aria-hidden="true"><svg class="i i-shelf" width="20" height="20" aria-hidden="true"><use href="/icons/ui.svg?v=c634899d#shelf"/></svg></span>Listening Room</a>
  </nav>
  <div class="appbar-end"></div>
</header>
<main class="guide-main">
  <!-- The contents (lib/help/guide-page.js): a bar to open on a phone or a
       tablet, a column beside the text on a wide screen. Hidden until the
       guide has loaded; the text itself never depends on it. -->
  <nav class="guide-toc" aria-label="Contents" hidden>
    <details>
      <summary><span class="toc-label">Contents</span><span class="toc-now"></span></summary>
      <ol></ol>
    </details>
  </nav>
  <!-- docs/guide.md, served from the binary at /guide.md, rendered by
       lib/help/markdown.js and cut into parts by lib/help/guide-page.js. -->
  <article id="guide" class="guide">Loading…</article>
</main>
<script type="module">
  import { renderMarkdown } from '/lib/help/markdown.js';
  import { sectionize, initGuidePage } from '/lib/help/guide-page.js';
  import { initNav } from '/lib/nav.js';
  initNav();
  const el = document.getElementById('guide');
  try {
    const res = await fetch('/guide.md');
    if (!res.ok) throw new Error(`status ${res.status}`);
    el.innerHTML = sectionize(renderMarkdown(await res.text()));
    initGuidePage(el, document.querySelector('.guide-toc'));
    // Straight there on arrival; only a jump within the page glides.
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView({ behavior: 'instant' });
  } catch (e) {
    el.textContent = `Could not load the guide: ${e.message}`;
  }
  // Back goes where you came from, when that was this app.
  document.querySelector('.back').addEventListener('click', (e) => {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    } catch { /* follow the link */ }
  });
</script>
</body>
</html>
