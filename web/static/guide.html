<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hindsight guide</title>
<meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#002b36" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="guide-page">
<header class="topbar">
  <a class="back" href="/" aria-label="Back to Hindsight">‹</a>
  <b>The guide</b>
</header>
<main>
  <!-- docs/guide.md, served from the binary at /guide.md and rendered by
       lib/help/markdown.js. -->
  <article id="guide" class="guide">Loading…</article>
</main>
<script type="module">
  import { renderMarkdown } from '/lib/help/markdown.js';
  const el = document.getElementById('guide');
  try {
    const res = await fetch('/guide.md');
    if (!res.ok) throw new Error(`status ${res.status}`);
    el.innerHTML = renderMarkdown(await res.text());
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  } catch (e) {
    el.textContent = `Could not load the guide: ${e.message}`;
  }
  // Back goes where you came from, when that was this app.
  document.querySelector('.back').addEventListener('click', (e) => {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    } catch { /* follow the link */ }
  });
</script>
</body>
</html>
