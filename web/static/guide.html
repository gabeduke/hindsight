<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hindsight guide</title>
<meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#002b36" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="guide-page">
<header class="appbar">
  <a class="brand" href="/" data-tip="home"><img src="/icons/icon-192.png" alt=""><b>Hindsight</b></a>
  <!-- The switch between the three pages; on a phone, tabs along the
       bottom (lib/nav.js keeps it true). -->
  <nav class="appnav" aria-label="Pages">
    <a href="/" data-tab="capture" data-tip="nav-capture"><span class="appnav-lamp" aria-hidden="true"></span>Capture</a>
    <a href="/takes.html" data-tab="takes" data-tip="nav-takes"><svg class="appnav-ico" width="20" height="18" viewBox="0 0 20 18" aria-hidden="true"><path d="M2 3h16M2 9h16M2 15h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Takes</a>
    <a href="/tape.html" data-tab="tape" data-tip="nav-tape"><svg class="appnav-ico" width="24" height="18" viewBox="0 0 24 18" aria-hidden="true"><circle cx="6" cy="9" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="9" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 13.5h12" stroke="currentColor" stroke-width="2"/></svg>Tape</a>
  </nav>
  <div class="appbar-page">
    <a class="back" href="/" aria-label="Back to Hindsight"><span aria-hidden="true">‹</span><span class="back-text">Back</span></a>
    <h1 class="guide-title">The guide</h1>
  </div>
</header>
<main>
  <!-- docs/guide.md, served from the binary at /guide.md and rendered by
       lib/help/markdown.js. -->
  <article id="guide" class="guide">Loading…</article>
</main>
<script type="module">
  import { renderMarkdown } from '/lib/help/markdown.js';
  import { initNav } from '/lib/nav.js';
  initNav();
  const el = document.getElementById('guide');
  try {
    const res = await fetch('/guide.md');
    if (!res.ok) throw new Error(`status ${res.status}`);
    el.innerHTML = renderMarkdown(await res.text());
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  } catch (e) {
    el.textContent = `Could not load the guide: ${e.message}`;
  }
  // Back goes where you came from, when that was this app.
  document.querySelector('.back').addEventListener('click', (e) => {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    } catch { /* follow the link */ }
  });
</script>
</body>
</html>
