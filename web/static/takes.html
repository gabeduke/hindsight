<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takes — Hindsight</title>
<meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#002b36" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hindsight">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="shelf-page">
<!-- Every take, to search, filter and sort (lib/shelf-page.js). The main
     page keeps only the latest; this is where the rest live. -->
<header class="topbar shelf-top">
  <a class="back" href="/" aria-label="Back to the main page" data-tip="back-main">‹</a>
  <h1 class="shelf-title">Takes <span class="shelf-count" id="shelf-count" aria-label="takes shown">–</span></h1>
  <button class="chip" id="select-btn" type="button" data-tip="select">Select</button>
  <button id="help" class="icon-btn help-btn" type="button" aria-pressed="false" aria-label="Help" data-tip="help">?</button>
</header>
<main class="shelf-main">
  <div class="shelf-tools">
    <label class="shelf-search" data-tip="search">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M11.5 11.5 L16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      <input id="shelf-q" type="search" placeholder="Search names, times, tempo" aria-label="Search takes" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="seg shelf-filters" id="shelf-filters" role="group" aria-label="Show only" data-tip="filter">
      <button type="button" data-filter="starred" aria-pressed="false">★ Starred</button>
      <button type="button" data-filter="midi" aria-pressed="false">MIDI</button>
      <button type="button" data-filter="phone" aria-pressed="false">Phone</button>
      <button type="button" data-filter="tape" aria-pressed="false">Tape</button>
    </div>
    <div class="shelf-sort-row">
      <div class="seg" id="shelf-sort" role="group" aria-label="Sort" data-tip="sort">
        <button type="button" data-sort="newest" aria-pressed="true">Newest</button>
        <button type="button" data-sort="longest" aria-pressed="false">Longest</button>
      </div>
      <span class="shelf-store" id="shelf-store"></span>
    </div>
  </div>

  <div class="takes" id="takes"></div>
  <p class="empty" id="takes-empty">No takes yet. Capture one on the main page.</p>

  <!-- Deleted and pruned takes, for a week (lib/trash.js). Hidden while empty. -->
  <details class="panel trash" id="trash" hidden>
    <summary><h2>Recently deleted <span class="trash-count"></span></h2></summary>
    <ul class="trash-list"></ul>
    <div class="trash-foot">
      <span class="trash-keep"></span>
      <button class="icon-btn danger trash-empty" type="button" data-tip="trash-empty">Empty</button>
    </div>
  </details>
  <p class="about"><a href="/guide.html#31-the-takes-page" data-tip="guide">the guide</a></p>
</main>

<!-- Select mode's actions, over the bottom of the list (lib/takes.js). -->
<div class="select-bar" id="select-bar" hidden>
  <button class="icon-btn" id="sel-done" type="button" data-tip="select-done">Done</button>
  <span id="select-count">Tap takes to select</span>
  <button class="icon-btn" id="sel-star" type="button" aria-label="Star" data-tip="bulk-star">★</button>
  <button class="icon-btn" id="sel-export" type="button" data-tip="bulk-export">Export</button>
  <button class="icon-btn danger" id="sel-delete" type="button" data-tip="bulk-delete">Delete</button>
</div>

<div id="toasts" aria-live="polite"></div>

<dialog class="sheet" id="confirm">
  <form method="dialog" class="sheet-inner">
    <h3 id="confirm-title">Delete this take for good?</h3>
    <p id="confirm-name"></p>
    <div class="sheet-actions">
      <button class="icon-btn" value="cancel">Cancel</button>
      <button class="icon-btn confirm" value="delete">Delete</button>
    </div>
  </form>
</dialog>

<script type="module" src="/lib/shelf-page.js"></script>
</body>
</html>
