<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takes — Hindsight</title>
<meta name="theme-color" content="#e4e3dd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141516" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hindsight">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="shelf-page">
<!-- Every take, to search, filter and sort (lib/shelf-page.js). The main
     page keeps only the latest; this is where the rest live. -->
<header class="appbar">
  <a class="brand" href="/" data-tip="home"><img src="/icons/icon-192.png" alt=""><b>Hindsight</b></a>
  <!-- The switch between the three pages; on a phone, tabs along the
       bottom (lib/nav.js keeps it true). -->
  <nav class="appnav" aria-label="Pages">
    <a href="/" data-tab="capture" data-tip="nav-capture"><span class="appnav-lamp" aria-hidden="true"></span>Capture</a>
    <a href="/takes.html" data-tab="takes" data-tip="nav-takes" aria-current="page"><svg class="appnav-ico" width="20" height="18" viewBox="0 0 20 18" aria-hidden="true"><path d="M2 3h16M2 9h16M2 15h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Takes</a>
    <a href="/tape.html" data-tab="tape" data-tip="nav-tape"><svg class="appnav-ico" width="24" height="18" viewBox="0 0 24 18" aria-hidden="true"><circle cx="6" cy="9" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="9" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 13.5h12" stroke="currentColor" stroke-width="2"/></svg>Tape</a>
  </nav>
  <button id="help" class="icon-btn help-btn" type="button" aria-pressed="false" aria-label="Help" data-tip="help">?</button>
  <div class="appbar-page">
    <h1 class="shelf-title">Takes <span class="shelf-count" id="shelf-count" aria-label="takes shown">–</span></h1>
    <span class="appbar-spacer"></span>
    <button class="chip" id="select-btn" type="button" data-tip="select">Select</button>
  </div>
</header>
<main class="shelf-main">
  <div class="shelf-tools">
    <label class="shelf-search" data-tip="search">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M11.5 11.5 L16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      <input id="shelf-q" type="search" placeholder="Search names, times, tempo" aria-label="Search takes" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="shelf-toggles" id="shelf-filters" role="group" aria-label="Show only" data-tip="filter">
      <button class="icon-btn toggle" type="button" data-filter="starred" aria-pressed="false">★ Starred</button>
      <button class="icon-btn toggle" type="button" data-filter="midi" aria-pressed="false">MIDI</button>
      <button class="icon-btn toggle" type="button" data-filter="phone" aria-pressed="false">Phone</button>
      <button class="icon-btn toggle" type="button" data-filter="tape" aria-pressed="false">Tape</button>
    </div>
    <div class="shelf-sort-row">
      <div class="shelf-toggles" id="shelf-sort" role="group" aria-label="Sort" data-tip="sort">
        <button class="icon-btn toggle" type="button" data-sort="newest" aria-pressed="true">Newest</button>
        <button class="icon-btn toggle" type="button" data-sort="longest" aria-pressed="false">Longest</button>
        <button class="icon-btn toggle" type="button" data-sort="tag" aria-pressed="false">By tag</button>
      </div>
      <span class="shelf-store" id="shelf-store"></span>
    </div>
    <!-- One chip per tag, to show only that tag's takes (lib/shelf-page.js). -->
    <div class="shelf-toggles tag-filters" id="shelf-tags" role="group" aria-label="Tag" data-tip="tag-filter"></div>
  </div>

  <div class="takes" id="takes"></div>
  <p class="empty" id="takes-empty">No takes yet. Capture one on the main page.</p>
  <!-- On a wide screen: the take picked in the list, large (lib/shelf-detail.js). -->
  <aside id="take-detail" class="take-detail panel" hidden aria-label="The picked take"></aside>

  <!-- Deleted and pruned takes, for a week (lib/trash.js). Hidden while empty. -->
  <details class="panel trash" id="trash" hidden>
    <summary><h2>Recently deleted <span class="trash-count"></span></h2></summary>
    <ul class="trash-list"></ul>
    <div class="trash-foot">
      <span class="trash-keep"></span>
      <button class="icon-btn danger trash-empty" type="button" data-tip="trash-empty">Empty</button>
    </div>
  </details>
  <p class="about"><a href="/guide.html#31-the-takes-page" data-tip="guide">the guide</a></p>
</main>

<!-- Select mode's actions, over the bottom of the list (lib/takes.js). -->
<div class="select-bar" id="select-bar" hidden>
  <button class="icon-btn" id="sel-done" type="button" data-tip="select-done">Done</button>
  <span id="select-count">Tap takes to select</span>
  <button class="icon-btn" id="sel-star" type="button" aria-label="Star" data-tip="bulk-star">★</button>
  <button class="icon-btn" id="sel-export" type="button" data-tip="bulk-export">Export</button>
  <button class="icon-btn danger" id="sel-delete" type="button" data-tip="bulk-delete">Delete</button>
</div>

<div id="toasts" aria-live="polite"></div>

<dialog class="sheet" id="confirm">
  <form method="dialog" class="sheet-inner">
    <h3 id="confirm-title">Delete this take for good?</h3>
    <p id="confirm-name"></p>
    <div class="sheet-actions">
      <button class="icon-btn" value="cancel">Cancel</button>
      <button class="icon-btn confirm" value="delete">Delete</button>
    </div>
  </form>
</dialog>

<script type="module" src="/lib/shelf-page.js"></script>
</body>
</html>
