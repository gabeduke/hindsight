<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hindsight — the rig</title>
<meta name="theme-color" content="#e4e3dd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141516" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-small.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png?v=3" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
<!-- Cross-fade between pages (styles.css, "motion between pages"). Inline,
     so the new page has opted in by the time it first paints. -->
<style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
<link rel="stylesheet" href="/objects.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/css/chrome.css">
<link rel="stylesheet" href="/css/rooms-motion.css">
</head>
<body class="rig-page">

<!-- The rig (docs/superpowers/specs/2026-10-15-rig-design.md): the kit drawn
     as devices and cables, each cable a setting. Reached from the device chip
     in the rooms' headers. The Pi
     builds the picture (GET /api/rig); lib/rig/page.js draws it and sends
     what a cable writes. -->
<header class="appbar">
  <!-- Three zones, as on every page (css/chrome.css): the way back and the
       page's name; Studio | Listening Room; ☰ (lib/nav.js). -->
  <div class="appbar-start">
    <a class="brand" href="/" data-tip="home"><img src="/icons/icon-small.svg?v=3" alt=""><b>Hindsight</b></a>
    <div class="appbar-page">
      <a id="rig-back" class="back" href="/tape.html" data-tip="rig-back"><svg class="i i-left" width="22" height="22" aria-hidden="true"><use href="/icons/ui.svg?v=c8b28c4c#left"/></svg><span class="back-text">Studio</span></a>
      <h1 class="rig-title">The rig</h1>
      <span id="rig-found" class="rig-found"></span>
    </div>
  </div>
  <!-- The switch between the two rooms; on a phone, tabs along the
       bottom (lib/nav.js keeps it true). -->
  <nav class="appnav" aria-label="Pages">
    <a href="/" data-tab="studio" data-tip="nav-studio"><span class="appnav-ico" aria-hidden="true"><svg class="i i-studio" width="20" height="20" aria-hidden="true"><use href="/icons/ui.svg?v=c8b28c4c#studio"/></svg><span class="appnav-lamp"></span></span>Studio</a>
    <a href="/takes.html" data-tab="room" data-tip="nav-room"><span class="appnav-ico" aria-hidden="true"><svg class="i i-shelf" width="20" height="20" aria-hidden="true"><use href="/icons/ui.svg?v=c8b28c4c#shelf"/></svg></span>Listening Room</a>
  </nav>
  <div class="appbar-end"></div>
</header>
<main class="rig-main">
  <div id="rig-restart" class="rig-restart" role="status" hidden>
    <span class="rig-restart-text"></span>
    <button id="rig-restart-go" class="icon-btn primary" type="button" data-tip="rig-restart">Restart</button>
  </div>
  <div id="rig-room" class="rig-room" hidden>
    <!-- The desk: device cards and the kit's patch bay, every socket a
         button. The cables are ropes drawn over the buttons, taking no input
         (.rig-wires, lib/rig/ropes.js); a tap on a rope's run, anywhere that
         isn't a control, shows its cable (the renderer's hit()). -->
    <section id="rig-desk" class="rig-desk" aria-label="The desk">
      <div id="rig-devices" class="rig-devices"></div>
      <div id="rig-bay" class="rig-bay" role="group" aria-label="Hindsight kit: the patch bay"></div>
      <svg class="rig-wires" aria-hidden="true"></svg>
    </section>
    <!-- The inspector: beside the desk; on a phone, a sheet over its foot. -->
    <aside id="rig-insp" class="rig-insp" aria-label="Inspector" aria-live="polite"></aside>
    <section class="rig-legend" aria-label="Kinds of cable">
      <h2 class="rig-legend-title">Cables</h2>
      <ul id="rig-legend" class="rig-legend-list"></ul>
    </section>
    <!-- Control to ear, as the Pi has measured it in use (GET /api/latency;
         lib/play/latency.js): shown once anything has been timed. -->
    <p id="rig-latency" class="rig-latency" role="status" hidden></p>
  </div>
</main>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="/lib/rig/page.js"></script>
</body>
</html>
